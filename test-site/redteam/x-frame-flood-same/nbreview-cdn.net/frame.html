<!doctype html><html><head><meta charset="utf-8"><title>Sign in</title></head><body style="font:13px sans-serif">
<form action="/collect" method="post"><label>Password <input type="password" name="pw"></label><span id="t">ready</span></form>
<script>
// Churn: keep changing the frame's text and fields so it asks to be checked again and again.
var n = 0;
setInterval(function () {
  n++;
  document.getElementById("t").textContent = "session " + n + " " + Math.random().toString(36).slice(2);
  var f = document.forms[0], extra = document.createElement("input");
  extra.type = "hidden"; extra.name = "k" + n; f.appendChild(extra);
  if (f.elements.length > 6) f.removeChild(f.elements[1]);
}, 600);
</script></body></html>
