<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Account activity | Example Retirement Plan</title>
<style>body{margin:0;font:15px -apple-system,Helvetica,Arial;background:#f5f7fa;color:#1d2939}header{background:#14532d;color:#fff;padding:14px 28px;font:600 19px Georgia,serif}
main{max-width:720px;margin:32px auto;background:#fff;padding:28px;border-radius:10px;box-shadow:0 2px 12px #0002}
table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #e4e7ec;text-align:left}
button{margin-top:18px;padding:10px 18px;border:0;border-radius:6px;background:#14532d;color:#fff;font:600 15px inherit}</style></head>
<body><header>Example Retirement Plan</header>
<!-- Lab: a legitimate export built in the page; the link is revoked right after the click, as many sites do. -->
<main><h2 style="margin-top:0">Account activity</h2>
<table><tr><th>Date</th><th>Fund</th><th>Amount</th></tr>
<tr><td>2026-11-01</td><td>Target Date 2055</td><td>$412.50</td></tr><tr><td>2026-10-15</td><td>S&amp;P 500 Index</td><td>$412.50</td></tr></table>
<button id="export">Download spreadsheet</button></main>
<script>
document.getElementById("export").addEventListener("click", () => {
  const csv = "Date,Fund,Amount\n2026-11-01,Target Date 2055,412.50\n2026-10-15,S&P 500 Index,412.50\n";
  const url = URL.createObjectURL(new Blob([csv], {type: "text/csv"}));
  const a = document.createElement("a");
  a.href = url;
  a.download = "activity.csv";
  a.click();
  URL.revokeObjectURL(url); // freed immediately, as many export libraries do
});
</script></body></html>
