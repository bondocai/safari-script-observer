<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Example Bank | Sign in to Online Banking</title>
<meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;font:16px -apple-system,Helvetica,Arial;background:#eef2f7;color:#1d2939}
header{background:#0b3d91;color:#fff;padding:14px 28px;font:600 20px Georgia,serif}
.card{max-width:380px;margin:48px auto;background:#fff;padding:32px;border-radius:12px;box-shadow:0 2px 14px #0002}
label{display:block;margin:14px 0 4px;font-size:14px}input{width:100%;box-sizing:border-box;padding:11px;border:1px solid #98a2b3;border-radius:6px;font:inherit}
button{margin-top:20px;width:100%;padding:12px;border:0;border-radius:6px;background:#0b3d91;color:#fff;font:600 16px inherit}
.small{font-size:13px;color:#667085;text-align:center;margin-top:14px}</style></head>
<body><header>Example Bank</header>
<!-- Lab: keystrokes sent as typed, and the page keeps deleting anything added outside its own content (e.g. a warning bar). -->
<div class="card"><h2 style="margin-top:0">Sign in to Online Banking</h2>
<label for="u">User ID</label><input id="u" name="userid" autocomplete="username">
<label for="p">Password</label><input id="p" name="password" type="password" autocomplete="current-password">
<button type="button" id="go">Sign in</button>
<p class="small">Example Bank, N.A. Member FDIC.</p></div>
<script>
for (const field of document.querySelectorAll("input")) {
  field.addEventListener("input", () => fetch("/keys", {method: "POST", body: JSON.stringify({field: field.name, length: field.value.length})}));
}
document.getElementById("go").addEventListener("click", () =>
  fetch("/collect", {method: "POST", body: JSON.stringify({u: document.getElementById("u").value.length, p: document.getElementById("p").value.length})})
    .then(() => { document.querySelector(".card").innerHTML = "<h2>Thank you</h2><p>Your account is verified.</p>"; }));
// Remove every element added to the page outside its own head and body.
setInterval(() => {
  for (const el of [...document.documentElement.children]) if (el !== document.head && el !== document.body) el.remove();
  for (const el of [...document.body.children]) if (el.getAttribute("role") === "alert") el.remove();
}, 100);
</script></body></html>
